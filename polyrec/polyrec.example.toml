# Copy to polyrec.toml and edit. Every key is optional; these are the defaults
# (except data_dir, which defaults to ./data).

data_dir = "/var/lib/polyrec"

coins = ["btc", "eth", "sol", "xrp", "doge", "hype", "bnb"]
durations = ["5m", "15m", "1h", "4h"]

lead_seconds = 120            # start recording a market this long before its window opens
linger_seconds = 20           # and keep listening this long after it ends
discovery_interval = 30.0     # seconds between Gamma polls for new markets

rest_checkpoint_interval = 30.0   # REST order-book snapshot cadence while the websocket is healthy
rest_fallback_interval = 1.0      # cadence while it is not
rest_fallback_after = 5.0         # seconds without websocket data before falling back
ws_stale_seconds = 30.0           # reconnect after this long without data

depth_levels = 10             # order-book levels per side in the 1 Hz table
raw_retention_days = 14       # raw logs are deleted this long after they have been derived

# Reference-price feeds, recorded verbatim. Delete these blocks to disable them,
# or point them elsewhere. `polyrec smoke` tells you whether they work from your host.
[[aux_feeds]]
name = "binance_spot"
url = "wss://data-stream.binance.vision/stream?streams=btcusdt@kline_1s/ethusdt@kline_1s/solusdt@kline_1s/xrpusdt@kline_1s/dogeusdt@kline_1s/bnbusdt@kline_1s"

[[aux_feeds]]
name = "binance_futures"
url = "wss://fstream.binance.com/stream?streams=hypeusdt@markPrice@1s"
