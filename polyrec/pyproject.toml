[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyrec"
version = "0.1.0"
description = "Recorder for Polymarket crypto up/down markets (5m, 15m, 1h, 4h) for backtesting"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15",
    "httpx>=0.27",
    "pyarrow>=15",
    "zstandard>=0.22",
    "orjson>=3.9",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "eth-account>=0.11"]
creds = ["eth-account>=0.11"]

[project.scripts]
polyrec = "polyrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
